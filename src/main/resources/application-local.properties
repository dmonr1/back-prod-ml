server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_rendimiento_local}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public,db_tp1
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:5100,http://127.0.0.1:5100
