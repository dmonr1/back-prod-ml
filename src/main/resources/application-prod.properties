server.port=${PORT:8085}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://front-prod-ml-production.up.railway.app}

app.ml.url=${APP_ML_URL:https://prod-ml-production.up.railway.app}
app.ml.ruta-prediccion=${APP_ML_RUTA_PREDICCION:/predict}

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public,db_tp1
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
