spring.application.name=rendimiento-academico-backend

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/db_rendimiento
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=db_tp1

spring.flyway.enabled=false
spring.flyway.default-schema=db_tp1
spring.flyway.schemas=db_tp1
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html

app.ml.url=http://localhost:8000
app.ml.ruta-prediccion=/predict

app.security.jwt.secret=Y29kZXgtdHAxLWJhY2tlbmQtand0LXNlY3JldC1jb2RleC10cDEtMjAyNg==
app.security.jwt.expiration-seconds=28800


logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.flyway.create-schemas=true
