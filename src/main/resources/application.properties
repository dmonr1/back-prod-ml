spring.application.name=rendimiento-academico-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=db_tp1

spring.flyway.enabled=false
spring.flyway.default-schema=db_tp1
spring.flyway.schemas=db_tp1
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html

app.ml.url=${APP_ML_URL:http://localhost:8000}
app.ml.ruta-prediccion=${APP_ML_RUTA_PREDICCION:/predict}

app.security.jwt.secret=${JWT_SECRET:Y29kZXgtdHAxLWJhY2tlbmQtand0LXNlY3JldC1jb2RleC10cDEtMjAyNg==}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.security.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
